<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 B｜素材盤點與姿態驗收</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 system-ui, "Microsoft JhengHei", sans-serif; color: #20302b; background: #f4f1e7; }
  main { max-width: 1500px; margin: auto; padding: 24px; }
  h1 { margin-bottom: 8px; } h2 { margin-top: 30px; }
  .notice { padding: 16px; background: #fff3d0; border-left: 4px solid #916126; }
  label { display: inline-block; margin: 12px 16px 12px 0; }
  select, button { font: inherit; padding: 7px 12px; border: 1px solid #8e9a91; border-radius: 5px; background: white; color: inherit; }
  .frames { display: grid; grid-template-columns: repeat(5, minmax(180px, 1fr)); gap: 12px; overflow-x: auto; }
  figure { margin: 0; min-width: 180px; border: 1px solid #b6b9ab; border-radius: 6px; overflow: hidden; background: #fff; }
  canvas { display: block; width: 100%; height: 380px; background-color: var(--preview-bg, #f8f4e8); }
  figcaption { padding: 12px; font-size: 14px; }
  .missing { min-height: 380px; display: grid; place-items: center; color: #665947; background: #eee8da; }
  .inventory { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
  .inventory canvas { height: 230px; }
  .status { color: #8a3129; font-weight: 700; }
  .ok { color: #236147; }
  a { color: #236147; overflow-wrap: anywhere; }
  details { padding: 8px; }
  #error { color: #912b20; }
  @media (max-width: 700px) { main { padding: 14px; } h1 { font-size: 24px; } }
</style>
<main>
  <h1>方案 B：素材盤點與姿態驗收</h1>
  <p class="notice" id="summary">讀取素材清單中。此頁獨立於遊戲，不會修改存檔或觸發戰鬥。</p>
  <label>動畫組 <select id="group" aria-label="動畫組"></select></label>
  <label>檢查底色 <select id="background" aria-label="檢查底色"><option value="#f8f4e8">淺色</option><option value="#26343d">深色</option><option value="#78927c">綠色</option></select></label>
  <p>圖片以可見輪廓等比例展示並對齊底線，供檢查臉型、服裝、武器及姿態差異。這是靜態比較，不能取代動作連續性、腳底錨點與遊戲實測。</p>
  <h2 id="group-title">角色姿態比較</h2>
  <p id="group-status" class="status"></p>
  <div id="frames" class="frames"></div>
  <h2>接地錨點與連續動作預覽</h2>
  <label><input type="checkbox" id="animate" checked> 循環播放</label>
  <label>單張姿態 <select id="pose" aria-label="單張姿態"></select></label>
  <canvas id="animation" width="900" height="520" style="height:auto;max-width:900px"></canvas>
  <p id="animation-status"></p>
  <h2>既有戰鬥素材盤點</h2>
  <p>A 級保留原圖；任何新姿態未驗收前不接入正式遊戲。點選檔名可查看原圖。</p>
  <div id="inventory" class="inventory"></div>
  <p id="error" role="alert"></p>
</main>
<script type="module" src="./preview.js"></script>
</html>
